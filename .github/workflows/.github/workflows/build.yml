
name: Build Rick Client

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find Gradle Project
        id: project
        shell: bash
        run: |
          PROJECT_FILE=$(find . -type f \
            \( -name build.gradle -o -name build.gradle.kts \) \
            -not -path '*/build/*' | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: No Gradle project found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Found project: $PROJECT_DIR"

      - name: Build Mod
        run: gradle -p "${{ steps.project.outputs.dir }}" build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Rick-Client-JAR
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
          if-no-files-found: error
